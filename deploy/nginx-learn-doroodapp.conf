# nginx — بدن‌نامه روی learn.doroodapp.ir (دور هشتم: دامنهٔ learn + هاردنینگ کامل)
# نصب: sudo cp deploy/nginx-learn-doroodapp.conf /etc/nginx/sites-available/learn && sudo ln -sf /etc/nginx/sites-available/learn /etc/nginx/sites-enabled/learn

server {
    listen 80;
    listen [::]:80;
    server_name learn.doroodapp.ir;

    root /var/www/learn;
    index index.html;

    # ACME برای certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # فشرده‌سازی
    gzip on;
    gzip_comp_level 5;
    gzip_types application/javascript application/json text/css image/svg+xml text/plain;

    # مدل‌های .bin.gz از قبل فشرده‌اند — بدون Content-Encoding سرو شوند
    location ~* \.bin\.gz$ {
        add_header Content-Type application/gzip;
        expires 30d;
        add_header Cache-Control "public";
    }

    # کش طولانی برای assetها
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA
    location / { try_files $uri $uri/ /index.html; }

    # ─── هاردنینگ امنیتی (دور هشتم — دستور مالک: بالاترین امنیت) ───
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # پرچم‌های nginx — سخت‌گیری مسیر
    autoindex off;
    server_tokens off;
}
