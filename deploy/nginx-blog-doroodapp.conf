# nginx — badannameh on blog.doroodapp.ir (HTTP فقط؛ certbot خودش بلاک 443 را اضافه می‌کند)
# نصب: sudo cp deploy/nginx-blog-doroodapp.conf /etc/nginx/sites-available/badannameh

server {
    listen 80;
    listen [::]:80;
    server_name blog.doroodapp.ir;

    root /var/www/badannameh;
    index index.html;

    # ACME برای گواهی
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # فشرده‌سازی
    gzip on;
    gzip_comp_level 5;
    gzip_types application/javascript application/json text/css image/svg+xml text/plain;

    # مدل‌های .bin.gz از قبل فشرده‌اند — بدون هدر Content-Encoding سرو شوند
    location ~* \.bin\.gz$ {
        add_header Content-Type application/gzip;
        expires 30d;
        add_header Cache-Control "public";
    }

    # کش طولانی برای assetها
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA
    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
