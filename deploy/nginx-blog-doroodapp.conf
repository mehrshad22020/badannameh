# nginx — بدن‌نامه روی blog.doroodapp.ir (نسخهٔ کامل: 80 ریدایرکت + 443 با گواهی LE)
# این نسخه فقط بعد از صدور گواهی نصب می‌شود؛ قبل از آن deploy-iran.sh بوت‌استرپ HTTP می‌سازد.

server {
    listen 80;
    listen [::]:80;
    server_name blog.doroodapp.ir;

    # ACME — باید قبل از ریدایرکت پاسخ بگیرد
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.doroodapp.ir;

    ssl_certificate /etc/letsencrypt/live/blog.doroodapp.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.doroodapp.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/badannameh;
    index index.html;

    # فشرده‌سازی
    gzip on;
    gzip_comp_level 5;
    gzip_types application/javascript application/json text/css image/svg+xml text/plain;

    # مدل‌های .bin.gz از قبل فشرده‌اند — بدون Content-Encoding سرو شوند
    location ~* \.bin\.gz$ {
        add_header Content-Type application/gzip always;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # کش طولانی برای assetها (HTML نه — در location /)
    location ~* \.(js|css|png|jpg|jpeg|svg|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA — بدون کش برای HTML (باگ کش HTML قدیمی با ارجاع نسخهٔ قدیمی asset)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ─── هاردنینگ ───
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    autoindex off;
    server_tokens off;
}
